# One permanent layout per connected monitor. Reload from the menu after editing.
new-window-placement = 'outer'
root-orientation = 'auto'

gap = 8

# Omit this table to keep default shortcuts. An explicit table replaces them all.
[bindings]
alt-h = 'focus-left'
alt-j = 'focus-down'
alt-k = 'focus-up'
alt-l = 'focus-right'
alt-shift-h = 'move-left'
alt-shift-j = 'move-down'
alt-shift-k = 'move-up'
alt-shift-l = 'move-right'
alt-ctrl-h = 'swap-left'
alt-ctrl-j = 'swap-down'
alt-ctrl-k = 'swap-up'
alt-ctrl-l = 'swap-right'
alt-minus = 'shrink-width'
alt-ctrl-minus = 'shrink-height'
alt-equal = 'grow-width'
alt-ctrl-equal = 'grow-height'
alt-shift-equal = 'balance-sizes'
alt-slash = 'toggle-orientation'
alt-shift-space = 'toggle-floating'
alt-f = 'fullscreen'
alt-tab = 'next-monitor'
alt-shift-tab = 'move-to-next-monitor'
alt-shift-r = 'reload-config'
